# Gateway Kong qui rejoint le réseau Docker du backend (catalog-service / order-service).
# 1) lancer le backend :  docker compose up -d --build   (dans le dépôt backend)
# 2) lancer la gateway  :  docker compose up -d           (ici)
services:
  kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001     # admin non exposé hors du conteneur
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes: ["./kong/kong.yml:/kong/kong.yml:ro"]
    ports: ["8000:8000"]                      # point d'entrée unique
    networks: [backend]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

networks:
  backend:
    external: true
    # Par défaut : réseau créé par le compose du backend (<dossier>_default).
    name: ${BACKEND_NETWORK:-tp-cesi-ammu-nation-backend-kafka_default}
