consumers:
  - username: poc_client
    plugins:
      jwt-auth:
        key: poc-client
        secret: poc-shared-secret-hs256-0123456789abcdef
        algorithm: HS256
upstreams:
  - id: catalog
    type: roundrobin
    nodes: {"catalog:8080": 1}
    retries: 2
    timeout: {connect: 1, send: 5, read: 5}
  - id: front
    type: roundrobin
    nodes: {"front:80": 1}
  - id: auth
    type: roundrobin
    nodes: {"auth:8080": 1}
  - id: orders
    type: roundrobin
    nodes: {"orders-1:8080": 1, "orders-2:8080": 1}
    retries: 2
    timeout: {connect: 1, send: 5, read: 5}
global_rules:
  - id: 1
    plugins:
      request-id: {header_name: X-Request-Id, include_in_response: true}
routes:
  - id: front
    uri: /*
    priority: -10
    upstream_id: front
  - id: auth
    uri: /auth/*
    upstream_id: auth
    plugins:
      proxy-rewrite:
        regex_uri: ["^/auth/(.*)", "/$1"]
  - id: catalog
    uri: /api/catalog*
    upstream_id: catalog
  - id: orders
    uri: /api/orders*
    upstream_id: orders
    plugins:
      jwt-auth: {}
      limit-count:
        count: 20
        time_window: 1
        key_type: var
        key: consumer_name
        rejected_code: 429
#END
