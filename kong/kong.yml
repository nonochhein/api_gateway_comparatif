# Gateway Kong (DB-less) devant catalog-service et order-service (Spring Boot).
# Authentification : validation des JWT RS256 émis par DEUX SSO (Authentik et Authelia), en même temps.
# Kong OSS ne récupère pas les clés tout seul (pas de JWKS) : voir "À remplacer" ci-dessous et scripts/jwks_to_pem.py.
_format_version: "3.0"

consumers:
  # À REMPLACER : "key" = valeur exacte de la claim "iss" des jetons du SSO ; rsa_public_key = clé publique du SSO (PEM).
  # Les clés ci-dessous sont des clés de DÉMO dont la clé privée a été détruite : aucun jeton réel ne sera accepté tant qu'elles ne sont pas remplacées.
  - username: sso-authentik
    jwt_secrets:
      - algorithm: RS256
        key: "https://authentik.example.com/application/o/ammu-nation/"
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArLAw+OVP6PGh5BquzLrB
          YCcKta1edOCycNb5cE3Pru3cZVQkTq+O8WuS1n5Z6wD812J/gEbhNGj/t4Vn4Sjs
          /oppQ6VvFPVzm8/pJ0GzTDb94d21SncwPIz/EIe0gr0bDCnlRyTNBouS3Fp8Q5cQ
          GUTYOx3cetFr9vD+QHmavLmIx9uHmRZeq/x1Opcri2PWhkrbaNRXczIbXP68bF6P
          C+Yft3dJgeTTuod8ipfuKF6a2tFW3+e30X6B/ics++13uCDgyfdDh+q6VKd83dpS
          Ng4Pd5cZ/uC+gUyRo5a7ik7sI3TQxHUxdjQfZQ7QtVoJ82GRWO5RJynorFoiKgkH
          IQIDAQAB
          -----END PUBLIC KEY-----
  - username: sso-authelia
    jwt_secrets:
      - algorithm: RS256
        key: "https://auth.example.com"
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA32bD9y3XKAjwgGtoJMCe
          XbXyJwiPqLskU3RIYvLG0+ehHt1B/XLbO/EhFiq4TuuP6iVk3MuKlIRRxWirZFwp
          M9KTmXwzAqCsHWbr7kX2FTg2OVh/wnKPets4hE2LF8siyNi2XyzRr3p7InSluPF+
          9oraayPDrftRUYOf861czJsUy1dLSncKsVnSdcT4pJrYkYXv0o2hL2olL3r4YOiW
          QqvLAKq58bPPa0eeEjv7vERPUfeTGnJwsgEFsXvRgvVBHs0g/vJliW6o0MrHz9E7
          RqXtfRUPVSyjV+R9936ME1dfWD9r31iFJNxwqpChXxRD5zj3ZCjVjRIqZuN7cKUB
          uQIDAQAB
          -----END PUBLIC KEY-----

services:
  # Site Ammu-Nation (fichiers statiques). Chemin le plus court => priorité la plus basse : /api/* l'emporte.
  - name: front
    url: http://front:80
    routes:
      - {name: front, paths: ["/"], strip_path: false}

  - name: catalog-service
    url: http://catalog-service:8080
    connect_timeout: 1000
    read_timeout: 10000
    retries: 2
    routes:
      # Lecture publique du catalogue
      - name: catalog-read
        paths: ["/api/products", "/api/categories"]
        methods: [GET, HEAD, OPTIONS]
        strip_path: false
        plugins:
          - name: rate-limiting
            config: {second: 50, policy: local, limit_by: ip, error_code: 429}
      # Écriture du catalogue : jeton d'un des deux SSO obligatoire
      - name: catalog-write
        paths: ["/api/products", "/api/categories"]
        methods: [POST, PUT, PATCH, DELETE]
        strip_path: false
        plugins:
          - name: jwt
            config: {claims_to_verify: [exp]}
          - name: rate-limiting
            config: {second: 20, policy: local, limit_by: consumer, error_code: 429}
      # API interne (réservations) et supervision : jamais exposées à l'extérieur
      - name: blocked-internal
        paths: ["/internal", "/actuator"]
        strip_path: false
        plugins:
          - name: request-termination
            config: {status_code: 403, message: "Accès interdit"}

  - name: order-service
    url: http://order-service:8080
    connect_timeout: 1000
    read_timeout: 15000
    retries: 2
    routes:
      - name: orders
        paths: ["/api/orders"]
        strip_path: false
        plugins:
          - name: jwt
            config: {claims_to_verify: [exp]}
          - name: rate-limiting
            config: {second: 30, policy: local, limit_by: consumer, error_code: 429}
          - name: request-size-limiting
            config: {allowed_payload_size: 1, size_unit: megabytes}

plugins:
  - name: correlation-id
    config: {header_name: X-Request-Id, generator: uuid, echo_downstream: true}
  - name: cors
    config:
      origins: ["*"]          # dev : restreindre à l'origine du front / des SSO en production
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, X-Request-Id]
      exposed_headers: [X-Request-Id]
      credentials: false
      max_age: 3600
